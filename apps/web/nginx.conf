server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Docker DNS needs dynamic re-resolution after the api container is recreated.
    # Otherwise Nginx can retain the former IP address, causing HTTP 502.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api/ {
        set $api_backend "api:8000";
        # Preserve /api/ -> / mapping, including URL query parameters.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 65s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
