global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Auto-santé de Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['mangadvisor-prometheus:9090']

  # Scrape l'API FastAPI (expose /metrics sur 8000)
  - job_name: 'mangadvisor-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['mangadvisor-api:8000']
