# Opt-in only: never used by the ordinary local Docker commands.
# Bind HTTPS only to the explicitly chosen LAN IPv4 interface.
services:
  mobile_https:
    image: caddy:2.10-alpine
    container_name: mangadvisor_mobile_https
    restart: unless-stopped
    depends_on:
      - web
    environment:
      MANGADVISOR_LAN_IP: ${MANGADVISOR_LAN_IP:?Configure your private LAN address via cmd/mobile-setup.ps1}
      MOBILE_PASSWORD_HASH: ${MOBILE_PASSWORD_HASH:?Run cmd/mobile-setup.ps1 to create a password hash}
    ports:
      - "${MANGADVISOR_LAN_IP}:8443:8443"
    volumes:
      - ../mobile/Caddyfile:/etc/caddy/Caddyfile:ro
      - mangadvisor_mobile_caddy_data:/data
      - mangadvisor_mobile_caddy_config:/config
    networks:
      - mangadvisor_network

volumes:
  mangadvisor_mobile_caddy_data:
  mangadvisor_mobile_caddy_config:
