# Mangadvisor: default stable local Windows deployment (single UI at 8501).
# Combined with docker-compose.yml. No source hot-reload, no Streamlit port.
# All host ports bind only to 127.0.0.1; never expose DB/API publicly.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
  meilisearch:
    ports:
      - "127.0.0.1:${MEILI_PORT}:7700"
  api:
    ports:
      - "127.0.0.1:${API_PORT}:8000"
  web:
    ports:
      - "127.0.0.1:${UI_PORT}:80"
  # The engine uses its versioned image, not a hot-reloaded workspace.
  # Only raw downloaded catalog JSON persists across disposable engine runs.
  engine:
    volumes:
      - ../../data/raw:/workspace/data/raw
      # Source benchmark reports are local and excluded from Git.
      - ../../data/logs:/workspace/data/logs
