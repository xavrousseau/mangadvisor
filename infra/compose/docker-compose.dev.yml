services:
  # Expose PostgreSQL en local pour debug ou connexion via un outil externe.
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

  # Expose Meilisearch en local.
  meilisearch:
    ports:
      - "127.0.0.1:${MEILI_PORT}:7700"

  # Mode développement API :
  # - code monté depuis le poste local
  # - rechargement automatique
  api:
    ports:
      - "127.0.0.1:${API_PORT}:8000"
    volumes:
      - ../..:/workspace
    working_dir: /workspace
    command: ["uvicorn", "apps.api.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Nouvelle interface web par défaut (port 8501, réglable dans .env).
  web:
    ports:
      - "127.0.0.1:${UI_PORT}:80"

  # Streamlit exists exclusively in the development/test overlay.
  # Never used by mangadvisor.cmd or normal Windows users.
  ui:
    profiles: ["legacy"]
    build:
      context: ../..
      dockerfile: infra/docker/ui/Dockerfile
    container_name: mangadvisor_ui
    environment:
      API_BASE_URL: http://api:8000
      UI_PORT: ${UI_PORT}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mangadvisor_network
    ports:
      - "127.0.0.1:${LEGACY_UI_PORT:-8502}:8501"
    volumes:
      - ../..:/workspace
    working_dir: /workspace
    command: ["streamlit", "run", "apps/ui/app/app.py", "--server.port=8501", "--server.address=0.0.0.0"]

  # Mode développement engine :
  # code monté pour permettre l'exécution des scripts pipeline depuis le conteneur
  engine:
    volumes:
      - ../..:/workspace
    working_dir: /workspace
    command: ["python", "--version"]