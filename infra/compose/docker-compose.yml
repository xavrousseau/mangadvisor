name: mangadvisor

services:
  # Base de données principale du projet.
  # Stocke le catalogue canonique, les tags, les sources et plus tard les embeddings.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mangadvisor_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - mangadvisor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mangadvisor_network

  # Moteur de recherche textuelle.
  # Sert pour la recherche rapide par titre, alias et filtres.
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: mangadvisor_meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - mangadvisor_meili:/meili_data
    networks:
      - mangadvisor_network

  # API backend du projet.
  # Expose les endpoints applicatifs et dialogue avec PostgreSQL et Meilisearch.
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile
    container_name: mangadvisor_api
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MEILI_HOST: meilisearch
      MEILI_PORT: 7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      API_PORT: ${API_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - mangadvisor_network

  # Interface utilisateur Streamlit.
  # Elle consomme uniquement l'API et ne parle pas directement aux autres services.
  ui:
    build:
      context: ../..
      dockerfile: infra/docker/ui/Dockerfile
    container_name: mangadvisor_ui
    environment:
      API_BASE_URL: http://api:${API_PORT}
      UI_PORT: ${UI_PORT}
    depends_on:
      api:
        condition: service_started
    networks:
      - mangadvisor_network

  # Moteur du pipeline data.
  # Il servira à exécuter les scripts d'extraction, normalisation, enrichissement, chargement et indexation.
  engine:
    build:
      context: ../..
      dockerfile: infra/docker/engine/Dockerfile
    container_name: mangadvisor_engine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MEILI_HOST: meilisearch
      MEILI_PORT: 7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      ENABLE_TRANSLATION: ${ENABLE_TRANSLATION}
      ENABLE_OLLAMA: ${ENABLE_OLLAMA}
      OLLAMA_PORT: ${OLLAMA_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    # Commande neutre pour garder l'image simple tant que le pipeline n'est pas branché.
    command: ["python", "--version"]
    networks:
      - mangadvisor_network

volumes:
  # Données persistantes PostgreSQL
  mangadvisor_pgdata:

  # Données persistantes Meilisearch
  mangadvisor_meili:

networks:
  # Réseau dédié au projet Mangadvisor
  mangadvisor_network:
    name: mangadvisor_network