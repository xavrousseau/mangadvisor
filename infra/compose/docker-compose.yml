name: mangadvisor

services:
  # Base de données principale du projet.
  # Stocke le catalogue canonique, les tags, les sources et plus tard les embeddings.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mangadvisor_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - mangadvisor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mangadvisor_network

  # Moteur de recherche textuelle.
  # Sert pour la recherche rapide par titre, alias et filtres.
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: mangadvisor_meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - mangadvisor_meili:/meili_data
    networks:
      - mangadvisor_network

  # API backend du projet.
  # Expose les endpoints applicatifs et dialogue avec PostgreSQL et Meilisearch.
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile
    container_name: mangadvisor_api
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MEILI_HOST: meilisearch
      MEILI_PORT: 7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      API_PORT: ${API_PORT}
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-}
      LIBRETRANSLATE_API_KEY: ${LIBRETRANSLATE_API_KEY:-}
      # Explicit opt-in: the default guided advisor requires no model download.
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    # Start the Web UI only after FastAPI is ready to handle real SQL calls.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - mangadvisor_network

  # Local AI model: optional, never exposed via a host port. Use option 15
  # in mangadvisor.cmd to start it and download the model explicitly.
  ollama:
    image: ollama/ollama:0.6.8
    container_name: mangadvisor_ollama
    profiles: ["ai"]
    environment:
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - mangadvisor_ollama_models:/root/.ollama
    networks:
      - mangadvisor_network

  # Nouvelle application Mangadvisor : HTML/CSS/JS + proxy API via Nginx.
  # Elle devient l'interface par défaut sur le port UI_PORT.
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web/Dockerfile
    container_name: mangadvisor_web
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mangadvisor_network

  # Moteur du pipeline data.
  # Il servira à exécuter les scripts d'extraction, normalisation, enrichissement, chargement et indexation.
  engine:
    build:
      context: ../..
      dockerfile: infra/docker/engine/Dockerfile
    container_name: mangadvisor_engine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MEILI_HOST: meilisearch
      MEILI_PORT: 7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      MANGA_API_BASE_URL: ${MANGA_API_BASE_URL:-https://api.tenrai.org/v1}
      ENABLE_TRANSLATION: ${ENABLE_TRANSLATION}
      ENABLE_OLLAMA: ${ENABLE_OLLAMA}
      OLLAMA_PORT: ${OLLAMA_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    # Commande neutre pour garder l'image simple tant que le pipeline n'est pas branché.
    command: ["python", "--version"]
    networks:
      - mangadvisor_network

volumes:
  # Optional downloaded AI model files: never part of PostgreSQL backups.
  mangadvisor_ollama_models:
  # Données persistantes PostgreSQL
  mangadvisor_pgdata:

  # Données persistantes Meilisearch
  mangadvisor_meili:

networks:
  # Réseau dédié au projet Mangadvisor
  mangadvisor_network:
    name: mangadvisor_network