# =============================================================================
# nginx.conf — Reverse Proxy Mangadvisor (port 80)
# - UI (NiceGUI) en racine /
# - API FastAPI sous /api/   (strip du préfixe → backend voit /)
# - Consoles: /pgadmin, /minio, /meili, /grafana, /prometheus
# - WebSockets activés (Upgrade/Connection) pour UI/API
#
# ⚠ Notes subpath (Grafana, parfois PgAdmin/Prometheus) :
#   Si assets cassés en /grafana/, ajoute côté conteneur Grafana :
#     GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
#     GF_SERVER_SERVE_FROM_SUB_PATH=true
#   Sinon, accède via http://localhost:3001 (port direct).
# =============================================================================

worker_processes  1;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile            on;
  tcp_nopush          on;
  tcp_nodelay         on;
  keepalive_timeout   65;
  client_max_body_size 20m;

  # GZIP de base (optionnel)
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml;
  gzip_min_length 1024;

  # WebSockets helper
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    # -------------------------------------------------------------------------
    # 1) UI en racine (NiceGUI sur mangadvisor-ui:8080)
    #    → support WebSockets (NiceGUI/ASGI)
    # -------------------------------------------------------------------------
    location / {
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection $connection_upgrade;

      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Forwarded-Host  $host;

      proxy_read_timeout  300s;
      proxy_send_timeout  300s;

      proxy_pass http://mangadvisor-ui:8080;
    }

    # -------------------------------------------------------------------------
    # 2) API sous /api/  (strip du préfixe → backend reçoit /...)
    #    → support WebSockets (FastAPI/ASGI, si jamais utilisé)
    # -------------------------------------------------------------------------
    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection $connection_upgrade;

      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Forwarded-Host  $host;

      proxy_read_timeout  300s;
      proxy_send_timeout  300s;

      # TRÈS IMPORTANT : le "/" final remplace /api/ par / côté backend
      proxy_pass http://mangadvisor-api:8000/;
    }

    # -------------------------------------------------------------------------
    # 3) PgAdmin (UI admin Postgres)
    #    ⚠ Si souci d’assets en subpath, utilise http://localhost:5050 directement.
    # -------------------------------------------------------------------------
    location /pgadmin/ {
      proxy_set_header Host $host;
      proxy_pass http://mangadvisor-pgadmin:80/;
    }

    # -------------------------------------------------------------------------
    # 4) MinIO Console
    # -------------------------------------------------------------------------
    location /minio/ {
      proxy_set_header Host $host;
      proxy_pass http://mangadvisor-minio:9001/;
    }

    # -------------------------------------------------------------------------
    # 5) Meilisearch (console/API)
    # -------------------------------------------------------------------------
    location /meili/ {
      proxy_set_header Host $host;
      proxy_pass http://mangadvisor-meilisearch:7700/;
    }

    # -------------------------------------------------------------------------
    # 6) Grafana
    #    ⚠ Pour un subpath propre, voir les variables GF_SERVER_* dans le compose.
    # -------------------------------------------------------------------------
    location /grafana/ {
      proxy_set_header Host $host;
      proxy_pass http://mangadvisor-grafana:3000/;
    }

    # -------------------------------------------------------------------------
    # 7) Prometheus
    # -------------------------------------------------------------------------
    location /prometheus/ {
      proxy_set_header Host $host;
      proxy_pass http://mangadvisor-prometheus:9090/;
    }

    # -------------------------------------------------------------------------
    # 8) (Optionnel) Ollama en lecture (tests rapides)
    #    → tu peux commenter si tu préfères l’exposer uniquement en 11434.
    # -------------------------------------------------------------------------
    location /ollama/ {
      proxy_set_header Host $host;
      proxy_pass http://mangadvisor-ollama:11434/;
    }

    # -------------------------------------------------------------------------
    # 9) (Optionnel) Postgres Exporter (debug)
    # -------------------------------------------------------------------------
    location /pgexp/ {
      proxy_set_header Host $host;
      proxy_pass http://mangadvisor-postgres-exporter:9187/;
    }
  }
}
