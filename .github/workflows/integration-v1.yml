name: Validation intégrée Mangadvisor

on:
  pull_request:
  workflow_dispatch:

jobs:
  docker-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Configuration de test jetable
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=mangadvisor_ci
          POSTGRES_USER=manga_ci
          POSTGRES_PASSWORD=only-for-disposable-github-runner
          POSTGRES_PORT=5432
          MEILI_MASTER_KEY=disposable-ci-key-long-enough-2026
          MEILI_PORT=7700
          API_PORT=8000
          UI_PORT=8501
          EMBEDDING_MODEL=none
          ENABLE_TRANSLATION=false
          ENABLE_OLLAMA=false
          OLLAMA_PORT=11434
          EOF

      - name: Vérifier la configuration Docker du modèle IA facultatif
        shell: bash
        run: |
          # No heavyweight model download in CI: validate profiles and
          # ensure plain Docker startup cannot implicitly enable Ollama.
          BASE="docker compose --env-file .env -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.dev.yml"
          $BASE config --services | grep -Fx api
          if $BASE config --services | grep -Fx ollama; then
            echo "Ollama must NOT start without explicit AI profile"
            exit 1
          fi
          $BASE --profile ai config --services | grep -Fx ollama
          $BASE config --services | grep -Fx web
          if $BASE --profile legacy config --services | grep -Fx ui; then
            echo "Retired Streamlit service must not be present even with legacy profile"
            exit 1
          fi

      - name: Démarrer PostgreSQL et Meilisearch
        run: |
          docker compose --env-file .env -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.dev.yml up -d postgres meilisearch

      - name: Installer les schémas dans PostgreSQL de CI
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if docker compose --env-file .env -f infra/compose/docker-compose.yml \
              -f infra/compose/docker-compose.dev.yml exec -T postgres \
                pg_isready -U manga_ci -d mangadvisor_ci >/dev/null 2>&1; then break; fi
            sleep 2
          done
          for file in \
            sql/schema/001_jikan_source_tables.sql \
            sql/schema/002_canonical_manga_tables.sql \
            sql/schema/004_add_theme_demographic_tables.sql \
            sql/schema/006_add_jikan_recommendation_tables.sql \
            sql/schema/007_add_user_library_tables.sql \
            tests/smoke/seed_catalog.sql; do
            echo "Base jetable seulement : $file"
            docker compose --env-file .env -f infra/compose/docker-compose.yml \
              -f infra/compose/docker-compose.dev.yml exec -T postgres \
              psql -v ON_ERROR_STOP=1 -U manga_ci -d mangadvisor_ci < "$file"
          done

      - name: Construire uniquement API et site Web principal
        run: |
          docker compose --env-file .env -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.dev.yml up --build -d api web

      - name: Tester les vraies requêtes SQL via HTTP
        run: |
          python - <<'PY'
          import json, time, urllib.request
          def fetch(path):
              with urllib.request.urlopen('http://127.0.0.1:8000'+path,timeout=20) as r:
                  return json.load(r)
          for i in range(60):
              try:
                  if fetch('/health').get('status') == 'ok': break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError('API non disponible')
          assert fetch('/mangas?limit=12')['count'] == 12
          filtered=fetch('/mangas?q=Naruto&genre=Adventure&only_finished=true')
          assert filtered['count']==1 and filtered['items'][0]['title']=='Naruto',filtered
          cover=fetch('/covers/mangas?ids=1,2')
          assert cover['count']==2,cover
          library=fetch('/library?limit=20')
          assert len(library['items'])==3,library
          detail=fetch('/mangas/1')
          assert detail['title']=='Naruto' and detail['genres'],detail
          similar=fetch('/recommendations/similar?title=Naruto&limit=3')
          assert 'recommendations' in similar,similar
          def post(path, payload):
              req=urllib.request.Request(
                  'http://127.0.0.1:8000'+path,
                  data=json.dumps(payload).encode('utf-8'),
                  headers={'Content-Type':'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(req,timeout=40) as response:
                  return json.load(response)
          profile=post('/recommendations/profile',{
              'liked_titles':['Naruto','Monster'], 'limit':3,
              'min_score':6.8,'only_finished':False,
              'exclude_sensitive_mismatches':False,
          })
          assert 'recommendations' in profile,profile
          library_reco=post('/recommendations/library',{
              'limit':3,'min_score':6.8,'only_finished':False,
              'exclude_sensitive_mismatches':False,'recommendation_goal':'READ_NEXT',
          })
          assert 'recommendations' in library_reco,library_reco
          payload=json.dumps({'manga_id':1,'lang':'fr'}).encode('utf-8')
          req=urllib.request.Request('http://127.0.0.1:8000/localization/synopsis',
              data=payload,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=20) as response:
              translation=json.load(response)
          assert 'text' in translation and translation['translated'] is False,translation
          print('OK : catalogue, filtres, couvertures, bibliothèque, fiche, traduction FR/EN et TROIS moteurs de recommandations.')
          PY

      - name: Indexer le catalogue public et verifier une recherche avec faute
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.dev.yml exec -T api \
            python -m apps.api.app.search_index
          python - <<'PY'
          import json,urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8000/mangas?q=Narutoo&limit=13",timeout=20) as response:
              result=json.load(response)
          assert any(item["title"]=="Naruto" for item in result["items"]),result
          print("Meilisearch real typo-tolerant search OK, PostgreSQL manga records intact")
          PY

      - name: Valider le lot BnF en SQL reel sans associations automatiques
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.dev.yml exec -T api python - <<'PY'
          import json
          import urllib.request
          from apps.api.app.main import get_connection
          from apps.api.app.bnf_batch import run_batch

          def counters():
              totals=[]
              with get_connection() as conn:
                  with conn.cursor() as cur:
                      for table in ("manga_fr_edition","user_manga_library",
                                    "user_manga_inventory_declaration","user_manga_volume"):
                          cur.execute("SELECT COUNT(*) AS n FROM "+table)
                          totals.append(cur.fetchone()["n"])
              return totals

          def fake_bnf(title):
              return {"items":[{
                  "isbn13":"9782871294146",
                  "title_fr":title+" Tome 1",
                  "author_fr":"Auteur de démonstration",
                  "publisher_fr":"Éditeur de démonstration",
                  "source_url":"https://catalogue.bnf.fr/ark:/12148/cb12345678x",
                  "status":"CANDIDATE_UNCONFIRMED",
                  "manga_match_verified":False,
                  "edition_kind_suggested":"UNKNOWN",
              }]}

          before=counters()
          report=run_batch(get_connection,limit=1,search=fake_bnf,sleep=lambda _ : None)
          assert report["selected"]==1 and report["checked"]==1,report
          assert report["candidates"]==1,report
          with get_connection() as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT manga_id FROM manga_bnf_candidate WHERE isbn13=%s",
                              ("9782871294146",))
                  staged=cur.fetchone()
                  assert staged,report
                  manga_id=staged["manga_id"]
          with urllib.request.urlopen(
              "http://127.0.0.1:8000/collection/mangas/"+str(manga_id)+"/bnf-candidates",
              timeout=15,
          ) as response:
              view=json.load(response)
          assert view["candidate_only"] is True and view["manga_match_verified"] is False,view
          assert view["items"][0]["registration_status"]=="TO_VERIFY",view
          assert view["items"][0]["isbn13"]=="9782871294146",view
          assert before==counters(),(before,counters())
          report2=run_batch(get_connection,limit=1,refresh=True,search=fake_bnf,sleep=lambda _:None)
          assert report2["candidates"]==1,report2
          with get_connection() as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT COUNT(*) AS n FROM manga_bnf_candidate WHERE manga_id=%s",
                              (manga_id,))
                  assert cur.fetchone()["n"]==1
          assert before==counters()
          print("BnF lot non destructif, API candidates, reprise sans doublons : OK")
          PY

      - name: Valider l'enrichissement Wikidata P4087 sur PostgreSQL jetable
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.dev.yml exec -T api python - <<'PY'
          import json
          import urllib.request
          from apps.api.app.main import get_connection
          from apps.api.app.wikidata_enrichment import run_batch

          def counts():
              with get_connection() as conn:
                  with conn.cursor() as cur:
                      values=[]
                      for table in (
                          "manga","manga_fr_edition","manga_genre","manga_theme",
                          "user_manga_library","user_manga_inventory_declaration",
                          "user_manga_volume",
                      ):
                          cur.execute("SELECT COUNT(*) AS n FROM "+table)
                          values.append(cur.fetchone()["n"])
                      return values

          def mock_lookup(ids):
              bindings=[]
              for mid, qid, label in [
                  (ids[0],"Q123456","Libelle FR test"),
                  (ids[1],"Q234567","Libelle alternatif un"),
                  (ids[1],"Q345678","Libelle alternatif deux"),
              ]:
                  bindings.append({
                      "malId":{"value":str(mid)},
                      "item":{"value":"http://www.wikidata.org/entity/"+qid},
                      "labelFr":{"value":label},
                      "descriptionFr":{"value":"description Wikidata, pas synopsis"},
                      "genreFr":{"value":"suspense"},
                  })
              return {"results":{"bindings":bindings}}
          before=counts()
          result=run_batch(get_connection,limit=2,lookup=mock_lookup)
          assert result["selected"]==2 and result["matched"]==1,result
          assert result["ambiguous"]==1 and result["labels_fr"]==1,result
          with get_connection() as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT manga_id FROM manga_wikidata_fact "
                              "WHERE wikidata_id=%s",("Q123456",))
                  row=cur.fetchone()
                  assert row is not None
                  manga_id=row["manga_id"]
          with urllib.request.urlopen(
              f"http://127.0.0.1:8000/enrichment/mangas/{manga_id}/wikidata",
              timeout=15,
          ) as response:
              data=json.load(response)
          assert data["status"]=="MATCHED",data
          assert data["label_fr"]=="Libelle FR test",data
          assert data["genres_fr"]==["suspense"],data
          assert data["match_basis"]=="exact_mal_manga_id_P4087",data
          assert not data["french_publisher_title_verified"],data
          assert not data["editions_verified"],data
          assert not data["description_is_plot_synopsis"],data
          assert before==counts(),(before,counts())

          repeated=run_batch(get_connection,limit=2,refresh=True,lookup=mock_lookup)
          assert repeated["matched"]==1 and repeated["ambiguous"]==1,repeated
          with get_connection() as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT COUNT(*) AS n FROM manga_wikidata_fact")
                  assert cur.fetchone()["n"]==1
          assert before==counts(),(before,counts())
          print("Wikidata P4087 : rapprochement exact, ambiguites et invariants SQL OK")
          PY

      - name: Verifier l'enrichissement de la mangatheque liee uniquement (SQL reel)
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.dev.yml exec -T api python - <<'PY'
          from apps.api.app.main import get_connection
          from apps.api.app.library_enrichment import (
              linked_library_scope, run_library_enrichment
          )
          from apps.api.app.wikidata_enrichment import run_batch as wd_batch
          from apps.api.app.bnf_batch import run_batch as bnf_batch

          def counts():
              with get_connection() as conn:
                  with conn.cursor() as cur:
                      result = []
                      for table in (
                          "manga", "manga_fr_edition", "manga_genre", "manga_theme",
                          "user_manga_library", "user_manga_inventory_declaration",
                          "user_manga_inventory_pending", "user_manga_volume",
                      ):
                          cur.execute("SELECT COUNT(*) AS n FROM " + table)
                          result.append(cur.fetchone()["n"])
                      return result

          def linked():
              with get_connection() as conn:
                  with conn.cursor() as cur:
                      cur.execute("""
                          SELECT COUNT(DISTINCT manga_id)::int AS n
                          FROM (
                            SELECT manga_id FROM user_manga_library WHERE user_id=1
                            UNION
                            SELECT manga_id FROM user_manga_inventory_declaration
                            WHERE user_id=1
                          ) linked
                      """)
                      return cur.fetchone()["n"]

          before = counts()
          scope = linked_library_scope(get_connection,max_works=250)
          assert len(scope["ids"]) == linked(),scope
          assert len(scope["ids"]) < before[0],scope  # not the full catalog
          calls=[]
          def wbatch(factory,**kw):
              assert set(kw["target_ids"]) == set(scope["ids"]),kw
              calls.append(("wikidata",kw["limit"]))
              return wd_batch(factory,lookup=lambda ids: {"results":{"bindings":[]}},**kw)
          def bbatch(factory,**kw):
              assert set(kw["target_ids"]) == set(scope["ids"]),kw
              calls.append(("bnf",kw["limit"]))
              return bnf_batch(factory,search=lambda title: {"items":[]},
                               sleep=lambda _:None,**kw)
          report=run_library_enrichment(get_connection,max_works=250,
                                        wikidata_batch=wbatch,bnf_batch=bbatch,
                                        sleep=lambda _:None)
          assert report["linked_works"] == linked(),report
          assert not report["failed_sources"],report
          assert len(calls) >= 2,calls
          assert before == counts(),(before,counts())
          repeated=run_library_enrichment(get_connection,max_works=250,
                                          wikidata_batch=wbatch,bnf_batch=bbatch,
                                          sleep=lambda _:None)
          assert not repeated["failed_sources"],repeated
          assert before == counts(),(before,counts())
          assert repeated["sources"]["wikidata"]["selected"] == 0,repeated
          assert repeated["sources"]["bnf"]["selected"] == 0,repeated
          print("Collection reliee uniquement, reprise idempotente, inventaire inchange : OK")
          PY

      - name: Verifier le proxy 8501 apres recreation de l'API sans redemarrer Nginx
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request
          # Container health and Nginx readiness are not instantaneous after
          # Compose startup. Allow the same bounded retry used after recreation.
          for attempt in range(30):
              try:
                  for path in ("/api/health", "/api/library?limit=1"):
                      with urllib.request.urlopen("http://127.0.0.1:8501"+path, timeout=5) as result:
                          assert result.status == 200, (path, result.status)
                          body=json.load(result)
                          if path == "/api/health":
                              assert body.get("status") == "ok", body
                          else:
                              assert isinstance(body.get("items"), list), body
                  print("OK: proxy 8501 avant recreation")
                  break
              except Exception as exc:
                  if attempt == 29:
                      raise RuntimeError("Proxy 8501 indisponible apres demarrage") from exc
                  time.sleep(2)
          PY
          docker compose --env-file .env -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.dev.yml up -d --no-deps --force-recreate api
          python - <<'PY'
          import json, time, urllib.request
          direct="http://127.0.0.1:8000"
          proxy="http://127.0.0.1:8501"
          for attempt in range(50):
              try:
                  with urllib.request.urlopen(direct+"/health", timeout=3) as response:
                      assert json.load(response)["status"] == "ok"
                  with urllib.request.urlopen(proxy+"/api/health", timeout=3) as response:
                      assert json.load(response)["status"] == "ok"
                  with urllib.request.urlopen(proxy+"/api/library?limit=1", timeout=3) as response:
                      assert isinstance(json.load(response)["items"],list)
                  print("OK: nginx retrouve l'API recreee et la bibliotheque repond")
                  break
              except Exception as exc:
                  if attempt == 49:
                      raise RuntimeError("HTTP 502 persistant apres recreation API") from exc
                  time.sleep(2)
          PY

      - name: Initialiser une édition française de test sans toucher aux données historiques
        run: |
          docker compose --env-file .env -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.dev.yml exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U manga_ci -d mangadvisor_ci < tests/smoke/seed_fr_editions.sql

      - name: Préparer la notice ISBN fictive du conseiller sur la base CI
        run: |
          docker compose --env-file .env -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.dev.yml exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U manga_ci -d mangadvisor_ci < tests/smoke/seed_advisor.sql

      - name: Vérifier les éditions et tomes séparément en PostgreSQL
        run: python tests/smoke/collection_smoke.py

      - name: Installer Playwright Chromium
        run: |
          python -m pip install playwright requests pillow openpyxl
          python -m playwright install --with-deps chromium

      # The advisor's synthetic French edition is tested before browser feedback
      # mutates the shared disposable library (including candidate exclusions).
      - name: Vérifier les contraintes du conseiller sur PostgreSQL jetable
        run: python tests/smoke/advisor_smoke.py

      - name: Tester une mangatheque OWNED sans notes sur PostgreSQL reel
        run: |
          docker compose --env-file .env -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.dev.yml exec -T api \
            python - < tests/smoke/advisor_ownership_smoke.py

      - name: Valider le conseiller conversationnel sur ordinateur et mobile
        run: python tests/smoke/advisor_browser.py

      - name: Contrôler l'interface Web ordinateur et mobile
        run: python tests/smoke/browser_smoke.py

      - name: Valider le nouvel import de bibliothèque CSV/XLSX sur navigateur et base CI jetable
        run: python tests/smoke/reading_library_browser.py

      - name: Valider le scanner ISBN sur ordinateur et mobile
        run: python tests/smoke/isbn_camera_browser.py

      - name: Vérifier les liens vérifiés entre sources et mangas proposés
        run: python tests/smoke/explanations_smoke.py

      - name: Tester la qualité des recommandations
        run: python tests/smoke/quality_smoke.py

      - name: Vérifier la découverte guidée contre PostgreSQL jetable
        run: python tests/smoke/mood_discovery_smoke.py

      - name: Valider la découverte selon l’envie sur ordinateur et mobile
        run: python tests/smoke/mood_discovery_browser.py

      - name: Vérifier la persistance des réactions et les exclusions
        run: python tests/smoke/feedback_smoke.py

      - name: Tester l'import CSV sans destruction des anciens compteurs
        run: python tests/smoke/collection_bulk_smoke.py

      - name: Prouver le cycle de résolution ISBN sur PostgreSQL CI
        run: |
          docker compose --env-file .env -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.dev.yml exec -T api \
            python - < tests/smoke/resolve_unknown_db.py

      # IMPORTANT: run only AFTER all feature tests; CI Jikan source rows are
      # intentionally sparse. Assert user IDs, ISBNs and reading states survive.
      - name: Prouver que la reconstruction Jikan préserve la bibliothèque
        run: python tests/smoke/rebuild_safety_smoke.py

      - name: Tester le benchmark prive en lecture seule sur donnees synthetiques
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private-data
          cat > private-data/mangatheque.csv <<'CSV'
          serie;tomes_principaux;doublons_identiques;autres_editions_a_identifier;statut_releve;ligne_source;oeuvre_commune;edition_declaree;format_catalogue_provisoire
          Naruto;72;72;0;Sans mention en cours;1;;;
          Monster;18;0;0;Sans mention en cours;2;;;
          Demo CI 08;10;0;2;Edition en cours;3;;;
          Oeuvre inexistante Mangadvisor CI;1;0;0;A verifier;4;;;
          Demo CI 05 version A;3;0;0;Sans mention en cours;5;Demo CI 05;Version A;INCONNU
          Demo CI 05 version B;4;0;0;Sans mention en cours;6;Demo CI 05;Version B;INCONNU
          CSV
          BEFORE="$(docker exec mangadvisor_postgres psql -X -At -U manga_ci -d mangadvisor_ci -c 'SELECT count(*) FROM user_manga_library')"
          pwsh -NoProfile -File cmd/benchmark-mangatheque.ps1
          pwsh -NoProfile -File cmd/benchmark-mangatheque.ps1
          AFTER="$(docker exec mangadvisor_postgres psql -X -At -U manga_ci -d mangadvisor_ci -c 'SELECT count(*) FROM user_manga_library')"
          test "$BEFORE" = "$AFTER"
          python - <<'PY'
          import json
          from pathlib import Path
          results=sorted(Path("private-data").glob("benchmark_mangatheque_*.json"))
          assert len(results)==2, results
          snapshots=[json.loads(p.read_text(encoding="utf-8-sig")) for p in results]
          for snap in snapshots:
              assert snap["type"]=="private_read_only_library_benchmark",snap
              assert snap["dry_run_status"]=="dry_run",snap
              assert snap["entries"]==6,snap
              assert snap["main_volumes"]==108,snap
              assert snap["duplicate_volumes"]==72,snap
              assert snap["other_editions"]==2,snap
              assert snap["matched_count"]>=3,snap
              assert len(snap["missing"])>=1,snap
              assert len(snap["scenarios"])==3,snap
              assert len(snap["groupes_editions_distinctes"])==1,snap
              group=snap["groupes_editions_distinctes"][0]
              assert group["oeuvre_commune"]=="Demo CI 05",group
              assert {r["edition_declaree"] for r in group["editions"]}=={"Version A","Version B"},group
              assert sorted(r["tomes_declares"] for r in group["editions"])==[3,4],group
              assert len(snap["collisions"])==0,snap
              assert snap["trusted_canonical_match_count"]>=4,snap
          assert any(snap["comparison_with_previous"] for snap in snapshots),snapshots
          print("Private read-only benchmark and repeated snapshot comparison verified")
          PY

      - name: Tester le menu PowerShell d'apercu de l'inventaire (sans ecriture)
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(docker exec mangadvisor_postgres psql -X -At -U manga_ci -d mangadvisor_ci -c 'SELECT count(*) FROM user_manga_library')"
          pwsh -NoProfile -File cmd/import-private-inventory.ps1 -CsvFile private-data/mangatheque.csv -PreviewOnly
          AFTER="$(docker exec mangadvisor_postgres psql -X -At -U manga_ci -d mangadvisor_ci -c 'SELECT count(*) FROM user_manga_library')"
          test "$BEFORE" = "$AFTER"
          find private-data -maxdepth 1 -name 'inventaire_apercu_*.json' -type f | grep -q .

      - name: Tester import physique 3.8 sans ecrasement des lectures ni ISBN inventes
        run: python tests/smoke/inventory_import_smoke.py

      - name: Vérifier le tableau des éditions physiques sur PC et mobile
        run: python tests/smoke/physical_inventory_browser.py

      - name: Prouver l'exclusion des mangas possedes physiquement sans suivi de lecture
        run: |
          docker compose --env-file .env -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.dev.yml exec -T api \
            python - < tests/smoke/ownership_exclusion_smoke.py

      - name: Rapprocher manuellement deux editions et preserver les lectures dans PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.dev.yml exec -T api python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import urllib.error
          from apps.api.app.main import get_connection

          base="http://127.0.0.1:8000"
          def api(path,data=None):
              request=urllib.request.Request(
                  base+path,
                  data=json.dumps(data).encode("utf-8") if data else None,
                  headers={"Content-Type":"application/json"} if data else {},
                  method="POST" if data else "GET",
              )
              with urllib.request.urlopen(request,timeout=15) as resp:
                  return json.load(resp)
          def snapshot():
              with get_connection() as conn:
                  with conn.cursor() as cur:
                      counts=[]
                      for table in ("user_manga_library","user_manga_volume",
                          "manga_fr_edition","user_manga_inventory_declaration",
                          "user_manga_inventory_pending","user_manga_inventory_resolution"):
                          cur.execute("SELECT COUNT(*) AS n FROM "+table)
                          counts.append(cur.fetchone()["n"])
                      return counts

          before=snapshot()
          prefix="ci:manual-edition-resolution:"
          with get_connection() as conn:
              with conn.cursor() as cur:
                  cur.execute("""SELECT m.id,m.title
                      FROM manga m WHERE NOT EXISTS (
                        SELECT 1 FROM user_manga_library l
                        WHERE l.manga_id=m.id AND l.user_id=1
                          AND l.library_status='NOT_INTERESTED'
                      )
                      AND NOT EXISTS (
                        SELECT 1 FROM user_manga_inventory_declaration d
                        WHERE d.manga_id=m.id AND d.user_id=1
                          AND d.edition_key='deluxe ci'
                      )
                      ORDER BY m.id LIMIT 1""")
                  manga=cur.fetchone()
                  assert manga
                  manga_id=manga["id"]
                  manga_title=manga["title"]
                  for edition,num in (("Deluxe CI",34),("Pastel CI",42)):
                      key=prefix+edition
                      cur.execute("""
                        INSERT INTO user_manga_inventory_pending
                        (user_id,source_key,entry_title,source_reference,
                         work_declared,edition_declared,format_hint,
                         main_volumes,duplicate_copies,other_editions_unknown,
                         review_status,candidate_ids,content_sha256)
                        VALUES (1,%s,%s,%s,%s,%s,%s,%s,0,0,
                                'REVIEW_MISSING',ARRAY[]::integer[],%s)
                      """,(
                          key,manga_title+" ("+edition+")",key,manga_title,
                          edition,"FORMAT_TO_VERIFY",num,"d"*64,
                      ))
              conn.commit()
          staged=snapshot()
          assert staged[4]==before[4]+2, (before,staged)

          for edition,num in (("Deluxe CI",34),("Pastel CI",42)):
              key=prefix+edition
              matches=api("/inventory/pending/candidates?"+
                  urllib.parse.urlencode({"source_key":key}))
              assert not matches["automatic_association"],matches
              assert matches["items"],matches
              query={"source_key":key,"manga_id":manga_id}
              reviewed=api("/inventory/pending/resolve/preview",query)
              assert reviewed["source"]["main_volumes"]==num,reviewed
              assert reviewed["source"]["edition_declared"]==edition,reviewed
              wrong={**query,"confirmation_token":"0"*64,
                     "acknowledge_work_and_edition":True}
              try:
                  api("/inventory/pending/resolve",wrong)
                  raise AssertionError("Stale approval unexpectedly accepted")
              except urllib.error.HTTPError as exc:
                  assert exc.code==409,exc
              confirmed=api("/inventory/pending/resolve",{
                  **query,"confirmation_token":reviewed["confirmation_token"],
                  "acknowledge_work_and_edition":True,
                  "resolution_mode":"CREATE_DECLARATION",
                  # An existing *different* physical edition may already be
                  # present; this CI test deliberately acknowledges the review.
                  "acknowledge_existing_inventory":True,
              })
              assert confirmed["status"]=="confirmed",confirmed
              assert confirmed["edition_declared"]==edition,confirmed
              assert confirmed["physical_volumes_declared"]==num,confirmed
              assert not confirmed["isbn_verified"],confirmed
              assert not confirmed["reading_status_modified"],confirmed
              assert not confirmed["progress_modified"],confirmed

          # The same Deluxe edition offered twice must be archived,
          # not counted as 34 extra physical volumes.
          duplicate_key=prefix+"already-counted"
          with get_connection() as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                    INSERT INTO user_manga_inventory_pending
                    (user_id,source_key,entry_title,source_reference,
                     work_declared,edition_declared,format_hint,
                     main_volumes,duplicate_copies,other_editions_unknown,
                     review_status,candidate_ids,content_sha256)
                    VALUES (1,%s,%s,%s,%s,'Deluxe CI','FORMAT_TO_VERIFY',
                            34,0,0,'REVIEW_MISSING',ARRAY[]::integer[],%s)
                  """,(duplicate_key,manga_title+" (duplicate CI)",duplicate_key,
                       manga_title,"e"*64))
              conn.commit()
          dupe_query={"source_key":duplicate_key,"manga_id":manga_id}
          dupe_preview=api("/inventory/pending/resolve/preview",dupe_query)
          assert dupe_preview["same_edition_exists"],dupe_preview
          assert dupe_preview["allowed_actions"]==["MARK_DUPLICATE"],dupe_preview
          try:
              api("/inventory/pending/resolve",{
                  **dupe_query,
                  "confirmation_token":dupe_preview["confirmation_token"],
                  "acknowledge_work_and_edition":True,
                  "resolution_mode":"MARK_DUPLICATE",
              })
              raise AssertionError("Archiving without comparison unexpectedly accepted")
          except urllib.error.HTTPError as exc:
              assert exc.code==422,exc
          dupe_confirm=api("/inventory/pending/resolve",{
              **dupe_query,
              "confirmation_token":dupe_preview["confirmation_token"],
              "acknowledge_work_and_edition":True,
              "resolution_mode":"MARK_DUPLICATE",
              "acknowledge_existing_inventory":True,
          })
          assert dupe_confirm["status"]=="confirmed",dupe_confirm
          assert not dupe_confirm["new_declaration_created"],dupe_confirm
          with get_connection() as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                    SELECT main_volumes FROM user_manga_inventory_declaration
                    WHERE user_id=1 AND manga_id=%s AND edition_key='deluxe ci'
                  """,(manga_id,))
                  assert cur.fetchone()["main_volumes"]==34
                  cur.execute("""
                    SELECT resolution_mode FROM user_manga_inventory_resolution
                    WHERE user_id=1 AND source_key=%s
                  """,(duplicate_key,))
                  assert cur.fetchone()["resolution_mode"]=="MARK_DUPLICATE"

          after=snapshot()
          assert after[:3]==before[:3],(before,after)
          assert after[3]==before[3]+2,(before,after)
          assert after[4]==before[4],(before,after)
          assert after[5]==before[5]+2,(before,after)
          with get_connection() as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                    SELECT edition_key,main_volumes
                    FROM user_manga_inventory_declaration
                    WHERE user_id=1 AND manga_id=%s AND edition_key IN
                      ('deluxe ci','pastel ci') ORDER BY edition_key
                  """,(manga_id,))
                  saved=cur.fetchall()
                  assert [(r["edition_key"],r["main_volumes"]) for r in saved]==[
                     ("deluxe ci",34),("pastel ci",42)
                  ],saved
                  cur.execute("""
                    SELECT COUNT(*)::int AS n FROM user_manga_inventory_resolution
                    WHERE user_id=1 AND source_key LIKE %s
                  """,(prefix+"%",))
                  assert cur.fetchone()["n"]==3
                  cur.execute("""
                    DELETE FROM user_manga_inventory_resolution
                    WHERE user_id=1 AND source_key LIKE %s
                  """,(prefix+"%",))
                  cur.execute("""
                    DELETE FROM user_manga_inventory_declaration
                    WHERE user_id=1 AND manga_id=%s
                      AND edition_key IN ('deluxe ci','pastel ci')
                  """,(manga_id,))
              conn.commit()
          assert snapshot()==before,(snapshot(),before)
          print("2 editions distinctes, archivage sans double compte, consentements et audit SQL : OK")
          PY

      - name: Verifier les recherches multilingues et le rapprochement manuel (SQL reel)
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.dev.yml exec -T api python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from apps.api.app.main import get_connection
          title="L'Attaque des Titres de CI"
          key="ci-multilingual-title-alias"
          with get_connection() as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT id,source_mal_id FROM manga ORDER BY id LIMIT 1")
                  work=cur.fetchone()
                  assert work
                  cur.execute("""
                    INSERT INTO manga_title_alias
                    (manga_id,source_name,source_id,language_code,alias,alias_key,source_url)
                    VALUES (%s,'TEST_CI','test','fr',%s,%s,'https://www.wikidata.org/wiki/Q1')
                    ON CONFLICT DO NOTHING
                  """,(work["id"],title,title.lower()))
                  cur.execute("""
                    INSERT INTO user_manga_inventory_pending
                    (user_id,source_key,entry_title,source_reference,
                    work_declared,edition_declared,format_hint,main_volumes,
                    duplicate_copies,other_editions_unknown,review_status,
                    candidate_ids,content_sha256)
                    VALUES (1,%s,%s,%s,%s,NULL,NULL,35,0,0,'REVIEW_MISSING',
                            ARRAY[]::integer[],%s)
                    ON CONFLICT DO NOTHING
                  """,(key,title,key,title,"7"*64))
              conn.commit()
          def api(path):
              with urllib.request.urlopen("http://127.0.0.1:8000"+path,timeout=15) as response:
                  return json.load(response)
          q=urllib.parse.quote(title)
          matches=api("/mangas?q="+q+"&limit=20")
          assert work["id"] in [x["id"] for x in matches["items"]],matches
          preview=api("/inventory/pending/candidates?"+urllib.parse.urlencode({
              "source_key":key,"q":title,
          }))
          candidate=next(x for x in preview["items"] if x["id"]==work["id"])
          assert candidate["matched_alias"]==title,candidate
          assert candidate["suggestion_kind"]=="EXACT_MULTILINGUAL_ALIAS",candidate
          assert preview["automatic_association"] is False,preview
          with get_connection() as conn:
              with conn.cursor() as cur:
                  cur.execute("DELETE FROM user_manga_inventory_pending WHERE user_id=1 AND source_key=%s",(key,))
                  cur.execute("DELETE FROM manga_title_alias WHERE manga_id=%s AND source_name='TEST_CI'",(work["id"],))
              conn.commit()
          print("Recherche FR / inventaire / ID canonique / aucun rapprochement automatique : OK")
          PY

      - name: Sauvegarder et valider une restauration complete de la mangatheque
        shell: bash
        run: |
          set -euo pipefail
          command -v pwsh
          pwsh -NoProfile -File cmd/library-backup.ps1 -Action Backup -NonInteractive
          BACKUP="$(find backups -maxdepth 1 -name 'mangadvisor_*.dump' -type f | head -n1)"
          test -s "$BACKUP"
          test -s "$BACKUP.json"
          pwsh -NoProfile -File cmd/library-backup.ps1 -Action Verify -NonInteractive
          export BACKUP
          python - <<'PY'
          import json, os
          from pathlib import Path
          original=Path(os.environ['BACKUP'])
          tampered=original.with_name('mangadvisor_20261019_121212_deadbeef.dump')
          tampered.write_bytes(original.read_bytes()+b'GARBAGE')
          manifest=json.loads(Path(str(original)+'.json').read_text(encoding='utf-8-sig'))
          manifest['file']=tampered.name
          Path(str(tampered)+'.json').write_text(json.dumps(manifest),encoding='utf-8')
          PY
          if pwsh -NoProfile -File cmd/library-backup.ps1 -Action Verify -NonInteractive -File backups/mangadvisor_20261019_121212_deadbeef.dump; then
            echo 'ERREUR : archive corrompue acceptee'
            exit 1
          fi
          rm -f backups/mangadvisor_20261019_121212_deadbeef.dump*
          MANGADVISOR_BACKUP_TEST_CI=1 pwsh -NoProfile -File cmd/library-backup.ps1 -Action Restore -NonInteractive -CiRestore -File "$BACKUP"
          docker exec mangadvisor_postgres psql -X -v ON_ERROR_STOP=1 -U manga_ci -d mangadvisor_ci -At -c "SELECT count(*) FROM user_manga_library" | grep -Eq '^[1-9][0-9]*$'
          docker exec mangadvisor_postgres psql -X -v ON_ERROR_STOP=1 -U manga_ci -d mangadvisor_ci -At -c "SELECT count(*) FROM manga_fr_edition" | grep -Eq '^[1-9][0-9]*$'
          echo 'Backup et restauration reelle sur PostgreSQL jetable : OK'

      - name: Valider HTTPS prive, certificat IP et authentification mobile
        shell: bash
        run: |
          set -euo pipefail
          HASH="$(printf '%s\n' 'mangadvisor-ci-password' | docker run --rm -i caddy:2.10-alpine caddy hash-password --algorithm bcrypt)"
          printf "MANGADVISOR_LAN_IP=127.0.0.1\nMOBILE_PASSWORD_HASH='%s'\n" "$HASH" > .env.mobile
          MOBILE="-f infra/compose/docker-compose.yml -f infra/compose/docker-compose.dev.yml -f infra/compose/docker-compose.mobile.yml"
          docker compose --env-file .env --env-file .env.mobile $MOBILE config --quiet
          docker compose --env-file .env --env-file .env.mobile $MOBILE up -d mobile_https
          docker compose --env-file .env --env-file .env.mobile $MOBILE ps mobile_https
          docker compose --env-file .env --env-file .env.mobile $MOBILE logs --no-color --tail=100 mobile_https
          HTTP=""
          for i in $(seq 1 20); do
            HTTP="$(curl --noproxy '*' -k --connect-timeout 3 --max-time 6 -s -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/ || true)"
            if [ "$HTTP" = "401" ]; then break; fi
            sleep 2
          done
          test "$HTTP" = "401" || { docker compose --env-file .env --env-file .env.mobile $MOBILE logs --no-color --tail=100 mobile_https; curl -kv --noproxy "*" --connect-timeout 3 --max-time 6 https://127.0.0.1:8443/ || true; echo "Expected 401 without login, got $HTTP"; exit 1; }
          docker cp mangadvisor_mobile_https:/data/caddy/pki/authorities/local/root.crt /tmp/mangadvisor-ca.crt
          HTTP="$(curl --noproxy '*' -s --connect-timeout 3 --max-time 6 --cacert /tmp/mangadvisor-ca.crt -u manga:mangadvisor-ci-password -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/)"
          test "$HTTP" = "200" || { echo "Expected TLS-verified login success, got $HTTP"; exit 1; }
          HTTP="$(curl --noproxy '*' -s --connect-timeout 3 --max-time 6 --cacert /tmp/mangadvisor-ca.crt -u manga:wrong-password -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/)"
          test "$HTTP" = "401" || { echo "Expected rejection of invalid password, got $HTTP"; exit 1; }
          echo "Mobile HTTPS: trusted local root, correct IP certificate and authentication OK"

