name: Vérifications Python

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances API
        run: python -m pip install -r apps/api/requirements.txt
      - name: Installer les dépendances UI
        run: python -m pip install -r apps/ui/requirements.txt
      - name: Vérifier la syntaxe Python
        run: python -m compileall -q apps/api apps/ui pipelines/engine tests tools
      - name: Auditer chaque fichier suivi et les contrats Docker/Web/SQL
        run: python tools/audit_repository.py --strict
      - name: Verifier la syntaxe de tous les modules web
        shell: bash
        run: |
          set -euo pipefail
          for script in apps/web/assets/*.js; do
            node --input-type=module --check < "$script"
          done
      - name: Tester tous les composants web (liste automatique)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/web/*.test.mjs
      - name: Tester la découverte et les couvertures
        run: python -m unittest discover -s tests -p 'test_*.py' -v
