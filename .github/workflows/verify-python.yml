name: Vérifications Python

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances API
        run: python -m pip install -r apps/api/requirements.txt
      - name: Installer les dépendances UI
        run: python -m pip install -r apps/ui/requirements.txt
      - name: Vérifier la syntaxe Python
        run: python -m compileall -q apps/api apps/ui pipelines/engine tests
      - name: Vérifier la syntaxe des modules web
        shell: bash
        run: |
          node --input-type=module --check < apps/web/assets/i18n.js
          node --input-type=module --check < apps/web/assets/app.js
          node --input-type=module --check < apps/web/assets/home.js
          node --input-type=module --check < apps/web/assets/explain.js
          node --input-type=module --check < apps/web/assets/appearance.js
          node --input-type=module --check < apps/web/assets/collection-view.js
          node --input-type=module --check < apps/web/assets/isbn-scanner.js
          node --input-type=module --check < apps/web/assets/mood-view.js
          node --input-type=module --check < apps/web/assets/advisor-view.js
          node --input-type=module --check < apps/web/assets/advisor-editions.js
          node --input-type=module --check < apps/web/assets/bulk-import-view.js
          node --input-type=module --check < apps/web/assets/unknown-isbn-view.js
          node --input-type=module --check < apps/web/assets/bibliography-view.js
      - name: Tester les sélections de l'accueil personnalisé
        run: node --test tests/web/home.test.mjs tests/web/explain.test.mjs tests/web/appearance.test.mjs tests/web/collection.test.mjs tests/web/bulk-import.test.mjs tests/web/unknown-isbn.test.mjs tests/web/bibliography.test.mjs tests/web/isbn-scanner.test.mjs tests/web/mood-view.test.mjs tests/web/advisor-view.test.mjs tests/web/advisor-editions.test.mjs
      - name: Tester la découverte et les couvertures
        run: python -m unittest discover -s tests -p 'test_*.py' -v
