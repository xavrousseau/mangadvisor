name: Vérifications Python

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances API
        run: python -m pip install -r apps/api/requirements.txt
      - name: Vérifier la syntaxe Python
        run: python -m compileall -q apps/api apps/ui pipelines/engine tests
      - name: Tester l'API des couvertures
        run: python -m unittest discover -s tests -p 'test_cover_api.py' -v
