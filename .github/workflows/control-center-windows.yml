name: Centre de pilotage Windows

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Verifier tous les scripts sous Windows PowerShell 5.1
        shell: powershell
        run: |
          # Windows PowerShell 5.1 reads UTF-8 without BOM as ANSI.
          # A UTF-8 em dash can corrupt the quotation marks and cause ParserError.
          $scripts = @(Get-ChildItem cmd -Filter "*.ps1" -File)
          if ($scripts.Count -lt 5) { throw "Scripts PowerShell attendus manquants." }
          foreach ($script in $scripts) {
            $bytes = [IO.File]::ReadAllBytes($script.FullName)
            $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 239 -and $bytes[1] -eq 187 -and $bytes[2] -eq 191
            if (-not $hasBom -and @($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
              throw "Encodage incompatible PowerShell 5.1 (UTF-8 sans BOM non-ASCII) : $($script.Name)"
            }
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Host
              throw "Erreur de syntaxe sous PowerShell 5.1 : $($script.Name)"
            }
            Write-Host "OK : $($script.Name)"
          }

      - name: Verifier les actions du menu simplifie
        shell: powershell
        run: |
          $menu = [IO.File]::ReadAllText((Join-Path $PWD "mangadvisor.cmd"))
          foreach ($number in 1..6) {
            $fragment = ('if "%CHOICE%"=="' + $number + '" set "KEY=')
            if (-not $menu.Contains($fragment)) { throw "Action $number absente du menu." }
          }
          foreach ($name in @("install","start","update","backup","diagnostic","stop")) {
            if (-not $menu.Contains(('if /I "%~1"=="' + $name + '"'))) {
              throw "Commande directe manquante : $name"
            }
          }
          if ($menu -notmatch ':advanced' -or $menu -notmatch ':maintenance') {
            throw "Les operations avancees ne sont pas protegees dans un sous-menu."
          }
          if ($menu -match 'start "Mangadvisor') {
            throw "Le lanceur ne doit plus creer de fenetres CMD detachees."
          }
          if (-not $menu.Contains("cmd\control-center.ps1")) {
            throw "Le centre de pilotage n'est pas branche au menu."
          }

      - name: Executer le nouveau lanceur batch sous Windows
        shell: powershell
        run: |
          $helpText = (& cmd.exe /d /c 'mangadvisor.cmd help' 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $helpText -notmatch 'install' -or $helpText -notmatch 'backup') {
            throw "Aide du lanceur invalide : $helpText"
          }
          $output = (& cmd.exe /d /c 'mangadvisor.cmd commande-inconnue' 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 1 -or $output -notmatch 'Commande inconnue') {
            throw "Le lanceur n'a pas refuse une commande invalide : $output"
          }
          $blocked = (& cmd.exe /d /c 'mangadvisor.cmd nuke' 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 1 -or $blocked -notmatch 'non disponible') {
            throw "Une commande destructive a ete exposee : $blocked"
          }
          $global:LASTEXITCODE = 0
          foreach ($sample in @("0`r`n","A`r`n0`r`n0`r`n","A`r`nS`r`n0`r`n0`r`n0`r`n")) {
            $inputFile = Join-Path $env:RUNNER_TEMP "ma_menu_input.txt"
            $outputFile = Join-Path $env:RUNNER_TEMP "ma_menu_output.txt"
            [IO.File]::WriteAllText($inputFile, $sample)
            $process = Start-Process -FilePath "cmd.exe" -ArgumentList @("/d","/c","mangadvisor.cmd") -WorkingDirectory $PWD -RedirectStandardInput $inputFile -RedirectStandardOutput $outputFile -PassThru
            if (-not $process.WaitForExit(10000)) {
              Stop-Process -Id $process.Id -Force
              throw "La navigation menu / sous-menus ne se termine pas."
            }
          }

      - name: Verifier la configuration initiale sans Docker
        shell: powershell
        run: |
          if (Test-Path .env) { throw "Le fichier .env ne doit pas etre commite." }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File cmd\control-center.ps1 -Action Environment
          if ($LASTEXITCODE -ne 0) { throw "Creation du .env impossible." }
          $firstHash = (Get-FileHash .env -Algorithm SHA256).Hash
          $pairs = @{}
          Get-Content .env | ForEach-Object {
            if ($_ -match '^([^#=]+)=(.*)$') { $pairs[$matches[1]] = $matches[2] }
          }
          if ($pairs.POSTGRES_PASSWORD.Length -lt 32 -or $pairs.MEILI_MASTER_KEY.Length -lt 32) {
            throw "Les secrets generes sont trop faibles."
          }
          if ($pairs.POSTGRES_PASSWORD -eq $pairs.MEILI_MASTER_KEY -or $pairs.POSTGRES_PASSWORD -eq 'changeme') {
            throw "Les secrets generes doivent etre differents et aleatoires."
          }
          if (-not (Test-Path private-data) -or -not (Test-Path backups)) {
            throw "Dossiers prives absents."
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File cmd\control-center.ps1 -Action Environment
          if ($LASTEXITCODE -ne 0) { throw "Relance de configuration impossible." }
          $secondHash = (Get-FileHash .env -Algorithm SHA256).Hash
          if ($firstHash -ne $secondHash) { throw "Le .env existant a ete modifie." }

      - name: Verifier la resolution securisee du port API dans .env
        shell: powershell
        run: |
          . .\cmd\local-api.ps1
          $settings=Join-Path $env:RUNNER_TEMP "mangadvisor_port_test.env"
          try {
            "API_PORT=8777" | Set-Content -LiteralPath $settings -Encoding Ascii
            if ((Get-MangadvisorApiUrl $settings) -cne "http://127.0.0.1:8777") {
              throw "Le port configure n'est pas respecte."
            }
            "API_PORT='8500'" | Set-Content -LiteralPath $settings -Encoding Ascii
            if ((Get-MangadvisorApiUrl $settings) -cne "http://127.0.0.1:8500") {
              throw "Le port entre apostrophes n'est pas respecte."
            }
            foreach ($bad in @("0","65536","8000/path","https://example.com")) {
              "API_PORT=$bad" | Set-Content -LiteralPath $settings -Encoding Ascii
              $rejected=$false
              try { $null=Get-MangadvisorApiUrl $settings } catch { $rejected=$true }
              if (-not $rejected) { throw "API_PORT invalide accepte : $bad" }
            }
          } finally {
            Remove-Item -LiteralPath $settings -Force -ErrorAction SilentlyContinue
          }

      - name: Tester la mise a jour Git en clone Windows jetable
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\windows\test-safe-git-update.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Le parcours de mise a jour Git securisee est invalide."
          }

      - name: Verifier le synchroniseur GitHub sur un clone Windows jetable
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\windows\test-github-sync.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Synchronisation GitHub non securisee ou collisions non gerees."
          }

      - name: Verifier la sauvegarde obligatoire avant l'import depuis le menu
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\windows\test-menu-import-backup.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "L'import de la mangatheque peut demarrer sans sauvegarde verifiee."
          }

      - name: Verifier une requete psql avec identifiants sans vraie base
        shell: powershell
        run: |
          # Dot-source the script in Environment mode; then replace docker in memory.
          # This executes Get-Count on Windows PowerShell 5.1 and catches
          # a newline breaking '-U' into a second PowerShell statement.
          . .\cmd\control-center.ps1 -Action Environment
          $script:received = @()
          function docker {
            $script:received = @($args)
            $global:LASTEXITCODE = 0
            "103"
          }
          $actual = Get-Count "manga"
          if ($actual -ne 103) { throw "Compte de mangas incorrect : $actual" }
          $received = $script:received
          if ($received[0] -ne "exec" -or $received[2] -ne "psql") {
            throw "docker exec psql doit etre invoque comme une commande unique."
          }
          $u = [array]::IndexOf($received,"-U")
          $d = [array]::IndexOf($received,"-d")
          $c = [array]::IndexOf($received,"-c")
          if ($u -lt 0 -or $d -lt 0 -or $c -lt 0) {
            throw "Des arguments psql sont absents."
          }
          if ($received[$u + 1] -ne (Config "POSTGRES_USER") -or
              $received[$d + 1] -ne (Config "POSTGRES_DB")) {
            throw "Identifiants psql differents du .env local."
          }
          if ($received[$c + 1] -ne "SELECT COUNT(*) FROM manga;") {
            throw "Requete SQL incorrecte."
          }
          $blocked = $false
          try { Get-Count "not_a_real_table" | Out-Null } catch { $blocked = $true }
          if (-not $blocked) { throw "La liste autorisee des tables n'est pas appliquee." }
